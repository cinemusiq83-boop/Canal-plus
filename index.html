      body { margin: 0; background: black; overflow: hidden; }
      #tvPlayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; object-fit: cover; }

      #overlay {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
        box-sizing: border-box; padding: 130px 3.5vw 26px;
        color: #fff; font-family: 'Canal', Arial, sans-serif; font-style: italic;
        background: linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.62) 55%, rgba(0,0,0,0) 100%);
        text-align: center; transition: opacity .5s; user-select: none;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }

      #headRow { position: relative; }
      #typedNumber {
        position: fixed; right: 3.5vw; bottom: 30px; z-index: 1100;
        font-family: 'Canal', Arial, sans-serif; font-style: italic; font-weight: 700;
        font-size: clamp(40px, 6vw, 84px); color: #fff; line-height: 1;
        text-shadow: 0 3px 10px rgba(0,0,0,.9); display: none; pointer-events: none;
      }
      #typedNumber.show { display: block; }
      #typedNumber.bad { color: #ff3b3b; }
      #epgTitle {
        margin: 0 auto; max-width: 74%;
        font-size: clamp(22px, 3.1vw, 42px); font-weight: 700; text-transform: uppercase;
        line-height: 1.15; text-shadow: 0 2px 8px rgba(0,0,0,.8);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #epgSub {
        margin: 8px auto 0; max-width: 70%; min-height: 1.3em;
        font-size: clamp(14px, 1.7vw, 22px); font-weight: 400; color: #e6e6e6;
        text-shadow: 0 2px 6px rgba(0,0,0,.8);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      #progress { position: relative; margin-top: 48px; height: 44px; }
      #channelLogo {
        position: absolute; right: 0; bottom: 100%; margin-bottom: 12px;
        max-height: 38px; max-width: 120px; object-fit: contain;

      const epgCache = {};

      function formatTime(dateStr) {
        const d = new Date(dateStr);
        return String(d.getHours()).padStart(2, '0') + '\u200Ah\u200A' + String(d.getMinutes()).padStart(2, '0'); // espaces très fines : évite que la police affiche « H »
      }

      function getTodayDate() {
        const now = new Date();
        return now.getFullYear().toString()
          + String(now.getMonth() + 1).padStart(2, '0')
          + String(now.getDate()).padStart(2, '0');
      }

      async function fetchEPG(channelNum) {
        const epgId = epgChannelIds[channelNum];
        if (!epgId) return null;
        const cacheKey = epgId + '_' + getTodayDate();
        if (epgCache[cacheKey]) return epgCache[cacheKey];
        try {
          const date = getTodayDate();
          const url = `https://epg.pw/api/epg.json?lang=fr&date=${date}&channel_id=${epgId}`;
          const resp = await fetch(url);
          if (!resp.ok) return null;
          const data = await resp.json();
          epgCache[cacheKey] = data;
          return data;
        } catch (e) {
          return null;
        }
      }

      // Programme en cours + suivants
      function getCurrentAndNext(epgData) {
        const empty = { now: null, next: null, upcoming: [] };
        if (!epgData || !epgData.epg_list || epgData.epg_list.length === 0) return empty;
        const list = epgData.epg_list;
        const now = new Date();
        for (let i = 0; i < list.length; i++) {
          const prog = list[i];
          const start = new Date(prog.start_date);
          const nextProg = list[i + 1];
          const end = nextProg ? new Date(nextProg.start_date) : new Date(now.getTime() + 3600000);
          if (start <= now && now < end) {
            return { now: { ...prog, end_date: end }, next: nextProg || null, upcoming: list.slice(i + 1) };
          }
        }
        return empty;
      }

      // ---------- Éléments ----------
      const overlay = document.getElementById('overlay');
      const panel = document.getElementById('panel');
      const elTyped = document.getElementById('typedNumber');
      function showTyped(txt, bad) { elTyped.textContent = txt; elTyped.classList.toggle('bad', !!bad); elTyped.classList.add('show'); }
      function hideTyped() { elTyped.classList.remove('show', 'bad'); }
      const elTitle = document.getElementById('epgTitle');
      const elSub = document.getElementById('epgSub');
      const elLogo = document.getElementById('channelLogo');
      const elProgress = document.getElementById('progress');
      const elFill = document.getElementById('barFill');
      const elDot = document.getElementById('barDot');
      const tStart = document.getElementById('tStart');
      const tNow = document.getElementById('tNow');
      const tEnd = document.getElementById('tEnd');
      const ctls = Array.from(document.querySelectorAll('.ctl'));
      const BTNS = ctls.map(b => b.dataset.act);   // next, info, zap

      elLogo.addEventListener('error', () => { elLogo.style.display = 'none'; });
      elLogo.addEventListener('load', () => { elLogo.style.display = ''; });

      let inputNumber = "";
      let timeout = null;
      let overlayTimer = null;
      const channelKeys = Object.keys(channels).sort((a, b) => parseInt(a) - parseInt(b));
      let currentIndex = 0;
      const player = document.getElementById("tvPlayer");

      let currentProg = { now: null, next: null, upcoming: [] };
      let btnState = 0;      // 0 = zapping chaînes, 1 = boutons, 2 = cartes du panneau
      let btnIdx = 1;        // bouton sélectionné (Informations par défaut)
      let panelMode = null;  // null | 'next' | 'info' | 'zap'
      let cardIdx = 0;
      let zapToken = 0;

      // ---------- Affichage du programme ----------
      function renderProgram() {
        const key = channelKeys[currentIndex];
        const cur = currentProg.now;
        if (!cur) {
          elTitle.textContent = '';
          elSub.textContent = '';
          elProgress.classList.add('empty');
        } else {
          const start = new Date(cur.start_date);
          const end = new Date(cur.end_date);
          const nowT = new Date();
          const pct = Math.min(100, Math.max(0, ((nowT - start) / (end - start)) * 100));
          elTitle.textContent = cur.title || '';
          elSub.textContent = (cur.desc || '').replace(/\s+/g, ' ').trim();
          elFill.style.width = pct + '%';
          elDot.style.left = pct + '%';
          tStart.textContent = formatTime(start);
          tEnd.textContent = formatTime(end);
          tNow.textContent = formatTime(nowT);
          tNow.style.left = pct + '%';
          tNow.style.visibility = 'visible';
          // Masque l'heure qui avance dès qu'elle touche l'heure de début ou de fin
          const rn = tNow.getBoundingClientRect(), rs = tStart.getBoundingClientRect(), re = tEnd.getBoundingClientRect();
          const gap = 12;
          if (rn.right + gap > re.left || rn.left - gap < rs.right) tNow.style.visibility = 'hidden';
          elProgress.classList.remove('empty');
        }
        if (panelMode === 'info' || panelMode === 'next') renderPanel();
      }

      async function updateEPGDisplay(channelNum) {
        const data = await fetchEPG(channelNum);
        if (channelKeys[currentIndex] !== String(channelNum)) return; // chaîne changée entre-temps
        currentProg = getCurrentAndNext(data);
        renderProgram();
      }

      // ---------- Panneaux ----------
      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      function renderPanel() {
        panel.innerHTML = '';
        if (!panelMode) { panel.classList.remove('show'); return; }
        panel.classList.add('show');
        const key = channelKeys[currentIndex];

        if (panelMode === 'info') {
          const cur = currentProg.now;
          const box = el('div', 'info');
          if (!cur) {
            box.appendChild(el('div', 'empty', 'Aucune information disponible pour cette chaîne.'));
          } else {
            box.appendChild(el('div', 'pt', cur.title || ''));
            box.appendChild(el('div', 'pm', formatTime(cur.start_date) + ' – ' + formatTime(cur.end_date)));
            box.appendChild(el('div', 'pd', cur.desc || 'Pas de description disponible.'));
          }
          panel.appendChild(box);
        }

        else if (panelMode === 'next') {
          const row = el('div', 'row');
          const list = currentProg.upcoming.slice(0, 12);
          if (!list.length) {
            panel.appendChild(el('div', 'empty', 'Aucun programme à suivre pour cette chaîne.'));
          } else {
            list.forEach((p, i) => {
              const nxt = currentProg.upcoming[i + 1];
              const c = el('div', 'card');
              c.appendChild(el('div', 'ct', formatTime(p.start_date) + (nxt ? ' – ' + formatTime(nxt.start_date) : '')));
              c.appendChild(el('div', 'cn', p.title || ''));
              row.appendChild(c);
            });
            panel.appendChild(row);
          }
        }

        else if (panelMode === 'zap') {
          const row = el('div', 'row');
          const keys = channelKeys.filter(k => epgChannelIds[k]);
          keys.forEach(k => {
            const c = el('div', 'card' + (k === key ? ' cur' : ''));
            c.dataset.key = k;
            const ch = el('div', 'ch');
            const logo = document.createElement('img');
            logo.src = channelLogos[k] || '';
            logo.addEventListener('error', () => { logo.style.display = 'none'; });
            ch.appendChild(logo);
            ch.appendChild(el('span', null, k));
            c.appendChild(ch);
            c.appendChild(el('div', 'ct', ''));
            c.appendChild(el('div', 'cn', '…'));
            c.addEventListener('click', e => { e.stopPropagation(); zapTo(k); });
            row.appendChild(c);
          });
          panel.appendChild(row);
          const curCard = row.querySelector('.cur');
          if (curCard) { cardIdx = Array.from(row.children).indexOf(curCard); row.scrollLeft = Math.max(0, curCard.offsetLeft - 40); }
          loadZapPrograms(row, keys);
        }
        refreshFocus();
      }

      async function loadZapPrograms(row, keys) {
        const token = ++zapToken;
        let i = 0;
        const worker = async () => {
          while (i < keys.length && token === zapToken) {
            const k = keys[i++];
            const data = await fetchEPG(k);
            if (token !== zapToken) return;
            const card = row.querySelector('[data-key="' + k + '"]');
            if (!card) continue;
            const p = getCurrentAndNext(data).now;
            card.querySelector('.cn').textContent = p ? (p.title || '—') : '—';
            card.querySelector('.ct').textContent = p ? formatTime(p.start_date) + ' – ' + formatTime(p.end_date) : '';
          }
        };
        await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);
      }

      function openPanel(mode) {
        if (panelMode === mode) { closePanel(); return; }
        panelMode = mode;
        cardIdx = 0;
        renderPanel();
        showOverlay(25000);
      }

      function closePanel() {
        panelMode = null;
        zapToken++;
        if (btnState === 2) btnState = 1;
        renderPanel();
      }

      function zapTo(k) {
        const idx = channelKeys.indexOf(k);
        if (idx >= 0) playChannelByIndex(idx);
      }

      function refreshFocus() {
        ctls.forEach((b, i) => b.classList.toggle('focus', i === btnIdx));
        panel.querySelectorAll('.card').forEach((c, i) => {
          const sel = btnState === 2 && i === cardIdx;
          c.classList.toggle('sel', sel);
          if (sel) c.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
      }

      ctls.forEach((b, i) => b.addEventListener('click', e => {
        e.stopPropagation();
        btnIdx = i; btnState = 1;
        refreshFocus();
        openPanel(BTNS[i]);
      }));

      // ---------- Lecture ----------
      function showOverlay(ms) {
        overlay.classList.remove("hidden");
        if (overlayTimer) clearTimeout(overlayTimer);
        const delay = ms || (panelMode ? 25000 : 7000);
        overlayTimer = setTimeout(() => {
          overlay.classList.add("hidden");
          panelMode = null; zapToken++; btnState = 0;
          renderPanel();
        }, delay);
      }

      function playChannelByIndex(index) {
        const key = channelKeys[index];
        const url = channels[key];
        player.src = url;
        player.play().catch(() => {});
        currentIndex = index;
        currentProg = { now: null, next: null, upcoming: [] };
        panelMode = null; zapToken++; btnState = 0;
        renderPanel();
        elLogo.src = channelLogos[key] || "";
        if (!channelLogos[key]) elLogo.style.display = 'none';
        elTitle.textContent = "Chargement…";
        elSub.textContent = '';
        elProgress.classList.add('empty');
        showOverlay();
        updateEPGDisplay(key);
      }

      function restartChannel() {
        if (currentIndex != null) {
          const key = channelKeys[currentIndex];
          player.src = channels[key];
          player.play().catch(() => {});
        }
      }

      player.addEventListener('error', restartChannel);

      let lastTime = 0;
      setInterval(() => {
        if (!player.paused && player.readyState > 0) {
          if (player.currentTime === lastTime) { restartChannel(); }
          lastTime = player.currentTime;
        }
      }, 5000);

      // Rafraîchit le programme / la barre de progression
      setInterval(() => {
        const key = channelKeys[currentIndex];
        if (key) updateEPGDisplay(key);
      }, 20000);

      // Clic / toucher sur l'écran : affiche l'interface
      document.addEventListener('click', () => showOverlay());

      // ---------- Télécommande / clavier ----------
      document.addEventListener('keydown', (event) => {
        const key = event.key;

        if (/^[0-9]$/.test(key)) {
          inputNumber += key;
          showTyped(inputNumber);
          showOverlay();
          if (timeout) clearTimeout(timeout);
          timeout = setTimeout(() => {
            if (channels[inputNumber]) {
              hideTyped();
              playChannelByIndex(channelKeys.indexOf(inputNumber));
            } else {
              showTyped(inputNumber, true);
              setTimeout(hideTyped, 1500);
              elLogo.src = ""; elLogo.style.display = 'none';
              elTitle.textContent = ''; elSub.textContent = '';
              elProgress.classList.add('empty');
            }
            inputNumber = "";
          }, 500);
          return;
        }

        const hidden = overlay.classList.contains('hidden');

        if (key === "ArrowRight" || key === "ArrowLeft") {
          const dir = key === "ArrowRight" ? 1 : -1;
          if (btnState === 0 || hidden) {
            playChannelByIndex((currentIndex + dir + channelKeys.length) % channelKeys.length);
          } else if (btnState === 1) {
            btnIdx = Math.min(BTNS.length - 1, Math.max(0, btnIdx + dir));
            refreshFocus(); showOverlay();
          } else if (btnState === 2) {
            const n = panel.querySelectorAll('.card').length;
            cardIdx = Math.min(n - 1, Math.max(0, cardIdx + dir));
            refreshFocus(); showOverlay();
          }
          event.preventDefault();
        }

        if (key === "ArrowDown") {
          if (hidden || btnState === 0) { showOverlay(); btnState = 1; }
          else if (btnState === 2) btnState = 1;
          refreshFocus(); showOverlay();
          event.preventDefault();
        }

        if (key === "ArrowUp") {
          if (btnState === 1) {
            if (panelMode && panel.querySelectorAll('.card').length) { btnState = 2; }
            else if (panelMode) closePanel();
            else btnState = 0;
          } else if (btnState === 2) { closePanel(); btnState = 0; }
          refreshFocus(); showOverlay();
          event.preventDefault();
        }

        if (key === "Enter") {
          if (hidden) { showOverlay(); }
          else if (btnState === 1) { openPanel(BTNS[btnIdx]); }
          else if (btnState === 2 && panelMode === 'zap') {
            const c = panel.querySelectorAll('.card')[cardIdx];
            if (c) zapTo(c.dataset.key);
          } else { showOverlay(); }
          event.preventDefault();
        }

        if (key === "Escape") {
          inputNumber = ""; hideTyped();
          if (timeout) clearTimeout(timeout);
          if (panelMode) { closePanel(); btnState = 0; refreshFocus(); showOverlay(); return; }
          btnState = 0;
          elLogo.src = ""; elLogo.style.display = 'none';
          elTitle.textContent = ''; elSub.textContent = '';
          elProgress.classList.add('empty');
          showOverlay();
        }
      });

      playChannelByIndex(currentIndex);
    </script>
  </body>
</html>
