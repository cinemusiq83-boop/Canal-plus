        font-size: 16px;
        font-weight: bold;

        color: #ccc;
        margin-top: 4px;
        max-height: 48px;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
      }
      #epgNext {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(255,255,255,0.2);
        font-size: 13px;
        color: #aaa;
      }
      #epgNext .epg-next-label { color: #ffd700; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
      #epgNext .epg-next-title { color: #ddd; font-weight: bold; }
      #epgNext .epg-next-time { color: #ffd700; }

      const epgCache = {};

      function formatTime(dateStr) {
        const d = new Date(dateStr);
        return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      }

      function getTodayDate() {
        const now = new Date();
        return now.getFullYear().toString()
          + String(now.getMonth() + 1).padStart(2, '0')
          + String(now.getDate()).padStart(2, '0');
      }

      async function fetchEPG(channelNum) {
        const epgId = epgChannelIds[channelNum];
        if (!epgId) return null;
        const cacheKey = epgId + '_' + getTodayDate();
        if (epgCache[cacheKey]) return epgCache[cacheKey];
        try {
          const date = getTodayDate();
          const url = `https://epg.pw/api/epg.json?lang=fr&date=${date}&channel_id=${epgId}`;
          const resp = await fetch(url);
          if (!resp.ok) return null;
          const data = await resp.json();
          epgCache[cacheKey] = data;
          return data;
        } catch(e) {
          return null;
        }
      }

      function getCurrentAndNext(epgData) {
        if (!epgData || !epgData.epg_list || epgData.epg_list.length === 0) return { now: null, next: null };
        const now = new Date();
        let current = null;
        let next = null;
        for (let i = 0; i < epgData.epg_list.length; i++) {
          const prog = epgData.epg_list[i];
          const start = new Date(prog.start_date);
          const nextProg = epgData.epg_list[i + 1];
          const end = nextProg ? new Date(nextProg.start_date) : new Date(now.getTime() + 3600000);
          if (start <= now && now < end) {
            current = { ...prog, end_date: end };
            next = nextProg || null;
            break;
          }
        }
        return { now: current, next };
      }

      async function updateEPGDisplay(channelNum) {
        const nowDiv = document.getElementById('epgNow');
        const nextDiv = document.getElementById('epgNext');
        nowDiv.innerHTML = '';
        nextDiv.innerHTML = '';
        const data = await fetchEPG(channelNum);
        if (!data) return;
        const { now: current, next } = getCurrentAndNext(data);
        if (current) {
          const start = new Date(current.start_date);
          const end = new Date(current.end_date);
          const nowT = new Date();
          const pct = Math.min(100, Math.max(0, ((nowT - start) / (end - start)) * 100)).toFixed(0);
          nowDiv.innerHTML = `
            <div class="epg-time">▶ ${formatTime(current.start_date)} – ${formatTime(end)}</div>
            <div class="epg-title">${current.title}</div>
            ${current.desc ? `<div class="epg-desc">${current.desc}</div>` : ''}
            <div style="margin-top:6px;height:3px;background:rgba(255,255,255,0.2);border-radius:2px;">
              <div style="width:${pct}%;height:3px;background:#ffd700;border-radius:2px;"></div>
            </div>
          `;
        }
        if (next) {
          nextDiv.innerHTML = `
            <div class="epg-next-label">Ensuite</div>
            <span class="epg-next-time">${formatTime(next.start_date)}</span>
            <span class="epg-next-title"> · ${next.title}</span>
          `;
        }
      }

      let inputNumber = "";
      let timeout = null;
      let overlayTimer = null;
      const channelKeys = Object.keys(channels).sort((a, b) => parseInt(a) - parseInt(b));
      let currentIndex = 0;
      const player = document.getElementById("tvPlayer");

      function showOverlay() {
        const overlay = document.getElementById("overlay");
        overlay.classList.remove("hidden");
        if (overlayTimer) clearTimeout(overlayTimer);
        overlayTimer = setTimeout(() => overlay.classList.add("hidden"), 7000);
      }

      function playChannelByIndex(index) {
        const key = channelKeys[index];
        const url = channels[key];
        player.src = url;
        player.play().catch(() => {});
        currentIndex = index;
        document.getElementById("currentChannel").innerText = "Chaîne " + key;
        document.getElementById("channelLogo").src = channelLogos[key] || "";
        document.getElementById("epgNow").innerHTML = '<div style="color:#aaa;font-size:13px;">Chargement du programme…</div>';
        document.getElementById("epgNext").innerHTML = '';
        showOverlay();
        updateEPGDisplay(key);
      }

      function restartChannel() {
        if (currentIndex != null) {
          const key = channelKeys[currentIndex];
          player.src = channels[key];
          player.play().catch(() => {});
        }
      }

      player.addEventListener('error', restartChannel);

      let lastTime = 0;
      setInterval(() => {
        if (!player.paused && player.readyState > 0) {
          if (player.currentTime === lastTime) { restartChannel(); }
          lastTime = player.currentTime;
        }
      }, 5000);

      setInterval(() => {
        const key = channelKeys[currentIndex];
        if (key) updateEPGDisplay(key);
      }, 60000);

      document.addEventListener('keydown', (event) => {
        const key = event.key;
        if (/[0-9]/.test(key)) {
          inputNumber += key;
          document.getElementById("currentChannel").innerText = "Numéro saisi: " + inputNumber;
          showOverlay();
          if (timeout) clearTimeout(timeout);
          timeout = setTimeout(() => {
            if (channels[inputNumber]) {
              const index = channelKeys.indexOf(inputNumber);
              playChannelByIndex(index);
            } else {
              document.getElementById("currentChannel").innerText = "Chaîne inexistante: " + inputNumber;
              document.getElementById("channelLogo").src = "";
              document.getElementById("epgNow").innerHTML = '';
              document.getElementById("epgNext").innerHTML = '';
            }
            inputNumber = "";
          }, 500);
        }
        if (key === "ArrowRight") playChannelByIndex((currentIndex + 1) % channelKeys.length);
        if (key === "ArrowLeft") playChannelByIndex((currentIndex - 1 + channelKeys.length) % channelKeys.length);
        if (key === "Escape") {
          inputNumber = "";
          document.getElementById("currentChannel").innerText = "Tapez un numéro de chaîne";
          document.getElementById("channelLogo").src = "";
          document.getElementById("epgNow").innerHTML = '';
          document.getElementById("epgNext").innerHTML = '';
          if (timeout) clearTimeout(timeout);
          showOverlay();
        }
      });

      playChannelByIndex(currentIndex);
    </script>
